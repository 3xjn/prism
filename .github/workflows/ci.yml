name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Roblox jest (Open Cloud)
    needs: quality
    runs-on: ubuntu-24.04
    # GitHub Actions ubuntu has no Studio GUI. Skip rather than fail the
    # quality gate when Open Cloud secrets are unset. This is not a Node vm.
    if: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY != '' && secrets.ROBLOX_UNIVERSE_ID != '' && secrets.ROBLOX_PLACE_ID != '' }}

    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --backend open-cloud --formatters github-actions
