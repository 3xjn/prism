name: Publish

# Manual only. Does not publish on merge. Default dry-run packs and verifies
# without contacting the npm registry. A real publish needs the @3xjn npm org
# and a trusted publisher bound to this workflow filename (publish.yml).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and verify only; do not npm publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == '3xjn/prism'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package tarball
        run: npm run verify:package

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
